name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # The VM is Ampere (ARM), so build natively on an ARM runner.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Skipped until the server address is set: gh variable set DEPLOY_HOST
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # Server .env is generated on every deploy: secrets from GitHub Secrets,
      # plain config from GitHub Variables. Values are single-quoted so Compose
      # does not interpolate `$` inside them.
      - name: Write .env
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          required="DOMAIN S3_ENDPOINT S3_BUCKET DATABASE_URL BETTER_AUTH_SECRET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY"
          for name in $required; do
            [ -n "${!name}" ] || { echo "::error::Missing $name (GitHub secret or variable)"; exit 1; }
          done
          export NEXT_PUBLIC_APP_URL="https://$DOMAIN"
          umask 077
          : > app.env
          for name in DOMAIN NEXT_PUBLIC_APP_URL EMAIL_FROM DATABASE_URL BETTER_AUTH_SECRET \
            S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_FORCE_PATH_STYLE \
            RESEND_API_KEY GEMINI_API_KEY GEMINI_MODEL; do
            printf "%s='%s'\n" "$name" "${!name}" >> app.env
          done

      - name: Copy stack files
        run: |
          ssh ubuntu@${{ vars.DEPLOY_HOST }} "mkdir -p ~/slowbooks"
          scp deploy/docker-compose.yml deploy/Caddyfile ubuntu@${{ vars.DEPLOY_HOST }}:~/slowbooks/
          scp app.env ubuntu@${{ vars.DEPLOY_HOST }}:~/slowbooks/.env
          rm app.env

      - name: Pull and restart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh ubuntu@${{ vars.DEPLOY_HOST }} \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin \
            && cd ~/slowbooks \
            && docker compose pull \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"
