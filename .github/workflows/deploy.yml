name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # The VM is Ampere (ARM), so build natively on an ARM runner.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Skipped until the server address is set: gh variable set DEPLOY_HOST
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy stack files
        run: |
          ssh ubuntu@${{ vars.DEPLOY_HOST }} "mkdir -p ~/slowbooks"
          scp deploy/docker-compose.yml deploy/Caddyfile ubuntu@${{ vars.DEPLOY_HOST }}:~/slowbooks/

      - name: Pull and restart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh ubuntu@${{ vars.DEPLOY_HOST }} \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin \
            && cd ~/slowbooks \
            && docker compose pull \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"
