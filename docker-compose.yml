# Local services. Postgres is external (managed), only file storage runs here.
# Optional local Postgres for offline work: docker compose --profile localdb up -d
services:
  storage:
    image: quay.io/minio/minio:latest
    container_name: slowbooks-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: slowbooks
      MINIO_ROOT_PASSWORD: slowbooks123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

  storage-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://storage:9000 slowbooks slowbooks123;
      mc mb --ignore-existing local/slowbooks;
      exit 0;
      "

  db:
    profiles: ["localdb"]
    image: postgres:17-alpine
    container_name: slowbooks-db
    environment:
      POSTGRES_USER: slowbooks
      POSTGRES_PASSWORD: slowbooks
      POSTGRES_DB: slowbooks
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  storage-data:
  db-data:
