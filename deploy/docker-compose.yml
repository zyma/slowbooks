# Production stack on the VM. CI copies this file and the Caddyfile to ~/slowbooks.
# ~/slowbooks/.env is written by CI from GitHub Secrets and Variables on every deploy.
services:
  app:
    image: ghcr.io/zyma/slowbooks:latest
    restart: unless-stopped
    env_file: .env

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
